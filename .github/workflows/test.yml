name: Test

on:
  push:
    branches:
      - main
      - development
      # The agent's own branches (#637). This is the machine edge of the
      # `agent:implement` loop: a failed attempt pushes its handoff commit
      # without opening a PR, so without a push trigger here CI never runs on
      # it and the retrigger — the whole point of the outer loop — never fires.
      # Branches that do have a PR run this twice; that is the cost.
      - 'agent/**'
  pull_request:

# CI's gate must equal the agent's gate. `agent/implement/run-policy.ts` runs
# `GATE_COMMAND = 'bun run gate'` (typecheck && lint && test) after every spawn;
# this workflow has to cover the same ground so nothing can be green here and red
# there. It never ran the component suites before (#648): the old single job ran
# only `bun run test:integration` (src/server/api), leaving 53 of 68 suites
# invisible — a null `usePathname()` under jsdom took out 96 tests and CI stayed
# green for two weeks.
#
# The split is deliberate, not a fast-path shortcut. The two halves have
# different needs and different failure modes, so they run as two jobs:
#
#   unit         no DB. typecheck + lint + `bun run test:unit` (everything
#                except the DB-backed suites and e2e). Measured ~7s for the jest
#                run; the whole DB-free half of `bun run gate` with no service
#                container to wait on.
#   integration  Postgres + pgvector. `bun run test:integration` (the DB-backed
#                suites under src/server/api AND src/app/api), serialized behind
#                the advisory lock in `jest.setup.ts`. Measured ~6s. Kept
#                separate so a DB/migration failure reads as a DB failure, not a
#                component failure.
#
# The split falls on the DB boundary, not on one directory. `jest.setup.ts`
# serializes every suite whose path contains `/server/api/` OR `/app/api/`
# behind the Postgres advisory lock, so those suites connect to the database
# just to acquire it — they must run in the `integration` job, never the DB-free
# `unit` one. `test.yml.test.ts` pins that: no DB-backed suite may land in
# `test:unit`, and every one must run in `test:integration`.
#
# `test:unit` ∪ `test:integration` == `bun run test` (jest ignores e2e), so
# together they run every suite the agent's gate does. If you narrow either
# command, you are narrowing what `GATE_COMMAND` transitively guarantees — keep
# them equal.
jobs:
  unit:
    # The DB-free half of `bun run gate`: typecheck, lint, and the component /
    # non-backend jest suites. No Postgres service, nothing to wait on.
    runs-on: ubuntu-latest

    env:
      # `bun run lint` is `next lint`, which loads `next.config.ts`; that file
      # calls `parseEnv()` at module scope, so lint aborts with "Invalid
      # environment variables" before it inspects a file if any required var is
      # missing. No query runs in this DB-free job, so these are inert
      # placeholders — present and non-empty is all `parseEnv` checks — not the
      # real secrets the integration/e2e jobs use. `next lint` sets NODE_ENV
      # itself, so it is not listed. Keep in sync with `src/env.ts`'s baseEnv;
      # `test.yml.test.ts` pins that this job supplies every var it requires.
      DATABASE_PRISMA_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DATABASE_URL_NON_POOLING: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXTAUTH_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
      OPENAI_API_KEY: ci-placeholder
      UNSPLASH_ACCESS_KEY: ci-placeholder
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      # `tsc --noEmit` resolves the generated Prisma types, so the client has to
      # exist before typecheck runs even though no query executes here.
      - name: Generate Prisma client
        run: bun run gen

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit

  integration:
    # The DB-backed half of `bun run gate`: the backend suites under
    # src/server/api and src/app/api that hit a real Postgres + pgvector.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend tests connect here; the pgvector extension + HNSW index are
      # created by `prisma migrate deploy` against this database.
      DATABASE_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/recipe_chat_test
      DATABASE_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/recipe_chat_test
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || 'ci-placeholder' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run gen

      - name: Apply migrations to the test database
        run: bun run migrate:deploy

      - name: Run integration tests
        run: bun run test:integration

  # Detects whether a change touches backend surfaces, so the e2e gate (which
  # boots the app + a browser) only pays its cost when user-facing behavior
  # could have changed. Docs/config/pure-styling PRs skip e2e.
  #
  # The route handlers under `src/app/api` are backend too, not just
  # `src/server`: they hit the database (the same DB boundary the `integration`
  # job runs and `jest.setup.ts` serializes), so a change to e.g. the chat route
  # or the Stripe webhook is real backend behavior a user hits. Leaving them out
  # here is the #648 failure mode — a backend surface invisible to a CI gate.
  #
  # The app-boot config is the same kind of surface. `next.config.ts` calls
  # `parseEnv()` (from `src/env.ts`) at module scope, and the e2e job's webServer
  # runs `next build`/`next start`, so a change to either can only fail in a
  # running app — the jsdom suites mock the environment and never boot Next.
  # Left unwatched, a boot-breaking config change skips e2e: green in CI, red the
  # moment the app starts. `test.yml.test.ts` pins that this filter watches both.
  #
  # `src/middleware.ts` is the same kind of surface again: it runs in the real
  # Next runtime on every non-`/api`, non-static request (locale detection +
  # cookie), and no jest suite executes it — only the e2e gate does. A middleware
  # change that breaks page loads would be green in CI (no jest coverage, e2e
  # skipped) and red the moment the app serves a request. `test.yml.test.ts` pins
  # that this filter watches it too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect backend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/server/**'
              - 'src/app/api/**'
              - 'src/middleware.ts'
              - 'src/env.ts'
              - 'prisma/**'
              - 'next.config.*'
              - 'e2e/**'
              - 'playwright.config.*'

  # Playwright e2e gate (#523). Runs only when backend code changed. Single
  # headless Chromium, self-contained on the runner — no Docker, no GHCR image,
  # no external browser service.
  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/recipe_chat_test
      DATABASE_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/recipe_chat_test
      # The built app needs these at boot; a real misconfig here should fail the
      # e2e job loudly (unlike the agent's best-effort verify phase).
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # `next.config.ts` validates the environment before `next build` runs, so
      # the build inside the Playwright webServer needs these too.
      NEXTAUTH_URL: http://localhost:3000
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || 'ci-placeholder' }}
      # `next start` (production) makes Auth.js reject any request whose host
      # isn't trusted, so every /api/auth/session call 500s and the auth fixture
      # never reaches /chat. Dev and Vercel auto-trust the host; a bare runner
      # does not — opt in explicitly so the e2e login works.
      AUTH_TRUST_HOST: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run gen

      - name: Apply migrations to the test database
        run: bun run migrate:deploy

      - name: Seed the database
        # The auth fixture logs in as the seeded user; login + populated-state
        # assertions need it present. No integration suite runs here to truncate.
        run: bun run seed

      # The browser binaries are ~100MB of download on every run and they only
      # change when the pinned Playwright version does, so key the cache on the
      # version resolved by `bun install` rather than on a lockfile hash. The
      # apt-installed OS deps do not live under ~/.cache/ms-playwright, hence
      # the second step: a cache hit still needs `install-deps`, just not the
      # download. A PR run cannot read another PR's cache, but it does fall
      # back to the default branch's, which a push to `main` refills.
      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
