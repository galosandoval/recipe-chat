name: Agent — Implement

# The `agent:implement` pipeline, on `@galosandoval/shopfloor` 1.0.0 (#637).
#
# The loop has two edges: a human labelling an issue `ready-for-agent`, and CI
# completing on a branch the agent pushed. Everything between them — the
# branch, the draft PR, the issue's labels, the handoff trail, the attempt
# ceiling — is a typed, tested function inside the package. What used to be 323
# lines of sequencing here is now two jobs: `admit` (does this event get to
# spend?) and one `shopfloor-run-phase` step surrounded by the setup this
# repository needs.
#
# `workflow_run` fires only from a workflow file on the default branch, so the
# machine edge stays dead until this file is on `main`.

on:
  issues:
    types: [labeled]
  workflow_run:
    # Our own test suite, by name (.github/workflows/test.yml). It runs on
    # pushes to `agent/**` as well as on pull requests, so a failed attempt
    # that pushed a handoff commit without opening a PR still retriggers.
    workflows: ['Test']
    types: [completed]

# One run per branch: a second event while a run is in flight would put two
# agents on one branch. Keyed on the branch rather than the issue, because
# `github.event.issue` is null on a `workflow_run` event — an issue-keyed group
# degrades to `run_id`, which is unique per run and excludes nothing, leaving
# the one edge that fires with no human on it with no mutual exclusion at all.
concurrency:
  group: agent-implement-${{ github.event.workflow_run.head_branch || format('agent/issue-{0}', github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  # Nothing is installed here but `npx` and `gh`. This job answers "may this
  # event start a run?" — classification, the spend gate (a live collaborator
  # permission probe that refuses on uncertainty, replacing an untested
  # `github.actor ==` line), the in-flight check, and the attempt ceiling —
  # before the runner pays for anything. An event the loop does not run on
  # exits zero, so ordinary label traffic never paints the repo red.
  #
  # It writes exactly once: a spent ceiling lands `agent:exhausted` and posts
  # the accumulated attempt trail here, because the job below is gated on this
  # verdict and so never runs to do it.
  admit:
    # A cheap pre-filter on both edges. Every condition here is decided again,
    # authoritatively, inside `shopfloor-admit` — this exists only so the
    # overwhelming majority of events that can never be a trigger don't boot a
    # runner to be told so. Each edge is spelled out rather than negating the
    # other, because the two triggers filter on different fields: the label
    # event has no `workflow_run`, and the CI event has no `label`.
    #
    # `Test` runs on every push to main and development and on every pull
    # request, so without the workflow_run half this job started a runner on
    # each of them. Only a *failed* run on an agent branch of this repository
    # can retrigger the loop (`classifyTrigger` refuses every other
    # conclusion), and a fork's `head_repository` is not ours.
    #
    # The remaining two machine-edge fences — the head commit's author, and the
    # `Shopfloor-Loop: closed` trailer that keeps a successful run's cleanup
    # commit from spending an attempt — need the commit itself, so they stay
    # where they can read it, inside `shopfloor-admit`.
    if: >-
      (github.event_name == 'issues' &&
      github.event.label.name == 'ready-for-agent') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'agent/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
    steps:
      - id: admit
        env:
          # AGENT_PAT, not GITHUB_TOKEN: the permission probe reads
          # collaborator permission, and the `agent:exhausted` write has to
          # fire downstream events like the rest of the pipeline.
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          # The bin exits non-zero on a real refusal so a caller who ignores
          # stdout is still stopped by it. This job does not ignore stdout — it
          # gates the expensive job on the verdict — so a *decided* refusal
          # here is a skip rather than a red workflow. A run already in flight,
          # or a spent ceiling, is ordinary traffic, and a check that paints
          # the repository red for ordinary traffic is a check people delete.
          #
          # What must not be swallowed with them is the undecided case: a bad
          # AGENT_PAT, an npx that could not fetch the package, a crash. Those
          # exit non-zero too, and reading only stdout renders them
          # indistinguishable from "not admitted" — an empty verdict, a skipped
          # job, a green check, and a pipeline that has quietly stopped
          # running. So the verdict is required to be parseable JSON, and
          # `undetermined` — which is what the bin reports when admission
          # itself failed, and what its spend gate reports when it cannot
          # answer — fails this job loudly.
          set +e
          verdict="$(npx --yes -p @galosandoval/shopfloor@1.0.0 shopfloor-admit)"
          set -e
          echo "$verdict"

          # `jq -r .admitted` alone cannot tell "the verdict says no" from "there
          # is no verdict" — both print something falsy — so the value is
          # required to be the literal `true` or `false` a decided verdict
          # carries. (`jq -e` is no good here either: it exits non-zero on a
          # `false` result, which is a perfectly ordinary refusal.)
          admitted="$(printf '%s' "$verdict" | jq -r 'if has("admitted") then .admitted else empty end' 2>/dev/null)"
          case "$admitted" in
            true | false) ;;
            *)
              echo "::error::shopfloor-admit produced no readable verdict — admission never ran. Treating this as a failure, not a refusal."
              exit 1
              ;;
          esac

          if [ "$(printf '%s' "$verdict" | jq -r '.refusal // empty')" = "undetermined" ]; then
            echo "::error::shopfloor-admit could not decide: $(printf '%s' "$verdict" | jq -r '.reason // "no reason given"')"
            exit 1
          fi
          echo "admitted=${admitted}" >> "$GITHUB_OUTPUT"

  run-phase:
    needs: admit
    if: needs.admit.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    # Backstop cap on the whole job, deliberately above the run-policy's
    # WALL_CLOCK_MINUTES = 45. That budget is enforced by the orchestrator
    # (SIGTERM, 30s, SIGKILL) and covers the agent alone — the setup steps
    # before it and the transcript upload after it are extra. Set equal, GitHub
    # would kill the job first and the run would lose its own diagnosis; the
    # margin here is what lets the guard fire and report. Held to that by
    # agent/implement/run-policy.test.ts.
    timeout-minutes: 75
    permissions:
      contents: write
      issues: write
      pull-requests: write

    services:
      # Same image/env pattern as .github/workflows/test.yml, so the agent can
      # run the full integration suite during TDD.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # AGENT_PAT (not GITHUB_TOKEN): a push made with the built-in token fires
      # no downstream events, so the machine edge would be dead; and pushing
      # under .github/workflows/ needs the PAT's `workflow` scope.
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      # The integration suite + any TDD against the DB connect here; the
      # pgvector extension + HNSW index are created by `prisma migrate deploy`.
      DATABASE_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/recipe_chat_test
      DATABASE_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/recipe_chat_test
      # The harness writes the transcript, PR description, verify report, and
      # failure reason here — outside the repo, so they never land in a commit.
      OUTPUT_DIR: ${{ runner.temp }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          # The harness locates or creates `agent/issue-<n>` itself and counts
          # the run's commits against the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the run-policy contract to the environment
        # The model, the turn cap, both runaway budgets, the CLI pin, the gate
        # command, the iteration ceiling, and the required-env list all reach
        # the harness as env vars. Written from agent/implement/run-policy.ts
        # so this file names no budget of its own and the two cannot disagree.
        run: bun agent/implement/run-policy.ts github-env >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install

      - name: Install Claude Code CLI
        # Pinned to the version the run-policy contract declares, read straight
        # from the module, so the install and the harness's `cli-version` check
        # can never freeze at different versions. bun's global installs skip
        # lifecycle scripts (`--trust` only affects a project's package.json,
        # not `-g`), so the postinstall that fetches the real platform-native
        # binary must run explicitly — otherwise `claude` is left as a stub that
        # fails to spawn (ENOEXEC).
        run: |
          version="$(bun agent/implement/run-policy.ts cli-version)"
          bun install -g "@anthropic-ai/claude-code@${version}"
          bun_install_dir="$(dirname "$(bun pm -g bin)")"
          node "${bun_install_dir}/install/global/node_modules/@anthropic-ai/claude-code/install.cjs"

      - name: Generate Prisma client
        run: bun run gen

      - name: Apply migrations to the service database
        run: bun run migrate:deploy

      - name: Seed the database
        # The prompt tells the agent the DB is already seeded with the user
        # `alice@prisma.io` (verify re-seeds after the gate truncates it).
        run: bun run seed

      - name: Install Playwright browser
        # The agent's VERIFY phase runs `bun run test:e2e` (headless Chromium)
        # against the booted app. Install the browser + OS deps here so the
        # agent doesn't need sudo. --with-deps is a no-op on an already-set-up
        # runner but keeps this self-contained.
        run: bunx playwright install --with-deps chromium

      - name: Run the phase
        # The whole of the loop, in one step. It reads GITHUB_EVENT_PATH
        # itself, so nothing here names an issue, a title, a branch, or a
        # phase — 1.0.0 refuses all four by name, before admission.
        env:
          # Subscription / flat-rate token — not ANTHROPIC_API_KEY.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: agent/implement/prompt.md
          # App/suite paths the agent may exercise during TDD.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # `next.config.ts` validates the environment before `next build`,
          # which the verify phase runs; without these the agent's build fails.
          NEXTAUTH_URL: http://localhost:3000
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || 'ci-placeholder' }}
          # The verify phase boots the same `next start` production build, so
          # Auth.js would reject the untrusted host and break the e2e login the
          # same way the PR e2e gate would. Trust the host explicitly here too.
          AUTH_TRUST_HOST: true
        run: npx --yes -p @galosandoval/shopfloor@1.0.0 shopfloor-run-phase

      - name: Post trajectory scorecard to the PR
        # Observability (#566), still ours under 1.0.0 (#637). The closure gate
        # inside `shopfloor-run-phase` grades this same scorecard and can hold
        # a run open on it, but it posts it nowhere — so without this step the
        # grade exists only inside a decision, and the human reading the PR
        # never sees it.
        #
        # Advisory and best-effort by contract: the runner swallows its own
        # errors, a missing or malformed transcript degrades to "no scorecard",
        # and `continue-on-error` keeps even an unforeseen crash from turning a
        # good run red. `success()` because a failed run has no PR to comment
        # on — its branch is the evidence.
        if: success()
        continue-on-error: true
        run: bun agent/implement/run-trajectory-check.ts

      - name: Strip verify screenshots off the branch tip
        # Still ours (#637). The harness strips its own attempt trail in the
        # commit that closes the loop and says so in `run-phase.ts`: "Nothing
        # strips the verify screenshots yet … that place does not exist." So
        # without this step the PNGs the agent committed for their raw URLs
        # ride the branch into the PR and into `main`.
        #
        # Safe to run after the fact: the harness pinned the comment's image
        # URLs to the commit it pushed, so they keep rendering once the tip no
        # longer carries the files. `success()` because a failed run has no PR
        # and no comment — its branch is evidence, not a deliverable.
        #
        # The `Shopfloor-Loop: closed` trailer is load-bearing: this commit is
        # a push onto an agent branch, which runs `Test`, and a red run on a
        # bot-authored commit *without* the trailer is exactly what the machine
        # edge answers. Unmarked, this step could spend an attempt re-running
        # the agent on work already handed to a human.
        #
        # Built on the remote tip, not on this workspace's HEAD. From 1.0.0 the
        # harness owns the branch and pushes its own commits during the run, so
        # the checkout here can be behind by the time this step runs — and a
        # commit made on a stale HEAD is a rejected push, which under
        # `success()` turns a finished, PR-opened run red for a cleanup detail.
        if: success()
        run: |
          branch="$(git branch --show-current)"
          if [ -z "$branch" ]; then
            echo "Detached HEAD — nothing to strip from a branch tip."
            exit 0
          fi

          git fetch --quiet origin "$branch"
          git reset --quiet --hard "origin/${branch}"

          if [ -z "$(git ls-files -- '.agent/verify')" ]; then
            echo "No committed verify screenshots on this branch."
            exit 0
          fi
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          git rm -rq -- '.agent/verify'
          git commit --no-verify -m "chore: drop verify screenshots (posted to the PR)" -m "Shopfloor-Loop: closed"
          git push origin "HEAD:${branch}"

      - name: Upload agent transcript
        # Observability (#532): the agent's full Claude Code session record —
        # every tool call with untruncated arguments. Runs on failure too
        # (`always()`) so blocked runs stay auditable, and never fails the run
        # (`continue-on-error`). The file lives outside the repo tree, so it is
        # never in a commit.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-transcript-${{ github.run_id }}
          path: ${{ runner.temp }}/transcript.jsonl
          if-no-files-found: warn
